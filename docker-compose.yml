# Local development: copy bot/.env.example to bot/.env and fill in values.
# For docker compose, set DATABASE_URL=postgresql://chronobot:chronobot@postgres:5432/chronobot
# and REDIS_URL=redis://redis:6379 (uses Docker service names, not localhost).
# Run: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chronobot
      POSTGRES_PASSWORD: chronobot
      POSTGRES_DB: chronobot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronobot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - path: ./bot/.env
        required: false
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
